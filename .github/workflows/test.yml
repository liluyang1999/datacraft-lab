# Stage 2, test: every test suite of the repository. Called only by cicd.yml after check passed.
#   backend   the Maven gate (format, Checkstyle, Enforcer, tests, shaded jar) and the jar's checks;
#             it shares the verified CLI jar with the airflow job
#   airflow   DAG contracts on Airflow 3.3.2 and the real engine, ETL retry and SFTP pipelines
#   scripts   the deployment, CI tooling, design, documentation and cost calculator suites
#   desktop   数艺工坊 on Linux (virtual display) and Windows (native UI Automation): its whole gate
#             and its test floor
# Packaging and the installer are build-stage work (build.yml).
name: Test

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: python3 -B cicd/step.py bash -e {0}

jobs:
  backend:
    name: backend (JDK 25 verify and jar checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLI_JAR: modules/interfaces/datacraft-cli/target/datacraft-cli.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-latest: the build enforces a JDK patch floor (pom.xml requireJavaVersion), and the
      # runner's preinstalled Temurin 25 may be older than the newest release.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: maven

      - name: Maven Wrapper verifies the Maven distribution
        run: bash cicd/build/check-maven-wrapper.sh

      # Full gate: Spotless format check, Checkstyle, Enforcer, unit tests, shaded package.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Assert every module executed its tests
        run: python3 -B cicd/build/check_test_counts.py .

      - name: Assert the Spark suite really ran
        run: bash cicd/build/check-spark-suite.sh

      - name: Smoke-test the CLI jar
        run: bash cicd/build/smoke-cli-jar.sh

      - name: Check the shaded jar's manifest, JSch algorithms and Jackson version
        run: bash cicd/build/check-jar-contents.sh

      - name: Check CLI exit codes and failure results
        run: bash cicd/build/check-cli-exit-codes.sh

      # The builder image compiles from the Docker build context, which has no tests/ or cicd/. This
      # runs its Maven command in a copy of that context, so such a build cannot break only later,
      # in the images job, where Docker hides the cause in the image build log.
      - name: Builder image's Maven command works in the Docker build context
        run: bash cicd/build/check-image-build.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-jdk25
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

      - name: Share the verified CLI with runtime tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-cli
          path: ${{ env.CLI_JAR }}
          retention-days: 1

  airflow:
    name: airflow (contracts and real pipelines, 3.3.2)
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/target/airflow-test
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # apache/airflow:3.3.2 runs Python 3.13, so the DAGs are tested on the same version;
      # cicd/airflow/install-airflow.sh picks the official constraints file for it.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up the packaged job runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-cli
          path: target/runtime

      # Airflow 3.3.2 with the official constraints for this Python, its providers, then pyspark,
      # then the fixed releases of orchestration/airflow/security-overrides.txt.
      - name: Install constrained Airflow, providers, the Spark runtime and the security overrides
        run: bash cicd/airflow/install-airflow.sh

      - name: Enforce the Airflow security floor
        run: python3 -B cicd/airflow/check_security_floor.py

      - name: Verify real DAG parsing and task execution boundaries
        run: python3 -B -m unittest discover -s tests/orchestration -v

      - name: Execute packaged engine, ETL retry and SFTP pipelines
        run: python3 -B tests/smoke/airflow_runtime_smoke.py --jar target/runtime/datacraft-cli.jar

      - name: Remove isolated Airflow state
        if: always()
        run: rm -rf -- "$AIRFLOW_HOME"

  scripts:
    name: scripts (deployment, CI, design, documentation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Deployment script and template tests
        run: python3 -B -m unittest discover -s tests/deploy -v

      - name: CI tooling tests
        run: python3 -B -m unittest discover -s tests/ci -v

      - name: Design token and generator tests
        run: python3 -B -m unittest discover -s tests/design -v

      - name: Documentation consistency tests
        run: python3 -B -m unittest discover -s tests/docs -v

      - name: Cloud cost calculator tests
        run: node --test tests/docs/cloud-costs.test.cjs

  desktop:
    # 数艺工坊, the JavaFX desktop console: a Maven project of its own (desktop/pom.xml) that no
    # other job builds. JavaFX needs a display, which xvfb-run provides on the runner.
    name: desktop (JavaFX 25, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: python -B cicd/step.py bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The step wrapper uses nonblocking Windows pipes, supported since Python 3.12.
      # Select the same runtime line as the Python jobs before any wrapped command runs.
      - name: Set up Python for the step wrapper
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: maven

      - name: Prepare fonts and the accessibility bus
        if: runner.os == 'Linux'
        run: bash cicd/desktop/prepare-linux.sh

      # Format, Checkstyle, Enforcer, unit, client, store and UI tests (every view in both themes,
      # no JavaFX warning, no stalled FX thread once warm), then the jar.
      - name: Verify the desktop console on a virtual display
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum ./mvnw -B -ntp -Pdesktop -pl :datacraft-desktop -am verify

      - name: Verify the desktop console and native UIA lifecycle on Windows
        if: runner.os == 'Windows'
        run: ./mvnw -B -ntp -Pdesktop -pl :datacraft-desktop -am verify -Dprism.verbose=true

      # The desktop suite against its own floor; the passing count becomes a notice.
      - name: Assert the desktop suite executed its tests
        run: python -B cicd/build/check_test_counts.py --project desktop

      - name: Upload the UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-ui-snapshots-${{ matrix.os }}
          path: desktop/target/ui-snapshots
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-desktop-${{ matrix.os }}
          path: desktop/target/surefire-reports/**
          if-no-files-found: ignore
