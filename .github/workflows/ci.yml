name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step goes through cicd/step.py. It runs the step with bash -e, which is what the runner
# would use anyway, and when the step fails it repeats the decisive lines of the output as an error
# annotation. Annotations can be read through the public API and job logs cannot, so the cause of a
# failure is visible without access to the repository. The script comes from the checkout, which
# is therefore the first step of every job.
defaults:
  run:
    shell: python3 -B cicd/step.py bash -e {0}

# Actions are pinned to full commit SHAs (the comment names the release) and runners to an explicit
# image, so neither a moved tag nor an ubuntu-latest migration changes CI without a commit here.
jobs:
  build:
    name: Build & verify (JDK 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLI_JAR: modules/interfaces/datacraft-cli/target/datacraft-cli.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-latest: the build enforces a JDK patch floor (pom.xml requireJavaVersion), and the
      # runner's preinstalled Temurin 25 may be older than the newest release.
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: maven

      # Each step runs one command: a script in cicd/, a test entry point in tests/, or a single
      # tool, so the pipeline logic can run and be reviewed outside GitHub Actions.
      - name: Maven Wrapper verifies the Maven distribution
        run: bash cicd/build/check-maven-wrapper.sh

      # Full gate: Spotless format check, Checkstyle, Enforcer, unit tests, shaded package.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Assert every module executed its tests
        run: python3 -B cicd/build/check_test_counts.py .

      - name: Assert the Spark suite really ran
        run: bash cicd/build/check-spark-suite.sh

      - name: Smoke-test the CLI jar
        run: bash cicd/build/smoke-cli-jar.sh

      - name: Check the shaded jar's manifest, JSch algorithms and Jackson version
        run: bash cicd/build/check-jar-contents.sh

      - name: Check CLI exit codes and failure results
        run: bash cicd/build/check-cli-exit-codes.sh

      # The builder image compiles from the Docker build context, which has no tests/ or cicd/. This
      # runs its Maven command in a copy of that context, so such a build cannot break only later,
      # in the containers job, where Docker hides the cause in the image build log.
      - name: Builder image's Maven command works in the Docker build context
        run: bash cicd/build/check-image-build.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-jdk25
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

      - name: Share the verified CLI with runtime tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-cli
          path: ${{ env.CLI_JAR }}
          retention-days: 1

  dags:
    name: Airflow contracts and real pipelines (3.3.2)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/target/airflow-test
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # apache/airflow:3.3.2 runs Python 3.13, so the DAGs are tested on the same version;
      # cicd/airflow/install-airflow.sh picks the official constraints file for it.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up the packaged job runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-cli
          path: target/runtime

      # Airflow 3.3.2 with the official constraints for this Python, its providers, then pyspark.
      - name: Install constrained Airflow, providers and the matching Spark runtime
        run: bash cicd/airflow/install-airflow.sh

      - name: Enforce the Airflow security floor
        run: python3 -B cicd/airflow/check_security_floor.py

      - name: Verify real DAG parsing and task execution boundaries
        run: python3 -B -m unittest discover -s tests/orchestration -v

      - name: Execute packaged engine, ETL retry and SFTP pipelines
        run: python3 -B tests/smoke/airflow_runtime_smoke.py --jar target/runtime/datacraft-cli.jar

      - name: Remove isolated Airflow state
        if: always()
        run: rm -rf -- "$AIRFLOW_HOME"

  scripts:
    name: Script, documentation and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to full commit SHAs
        run: bash cicd/lint/check-actions-pinned.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A fixed ShellCheck release, not the one the runner image happens to ship.
      - name: Install the pinned ShellCheck
        run: bash cicd/lint/install-shellcheck.sh

      - name: Shell syntax and ShellCheck
        run: bash cicd/lint/check-shell-scripts.sh

      - name: Deployment script and template tests
        run: python3 -B -m unittest discover -s tests/deploy -v

      - name: CI tooling tests
        run: python3 -B -m unittest discover -s tests/ci -v

      - name: Documentation consistency tests
        run: python3 -B -m unittest discover -s tests/docs -v

      - name: Cloud cost calculator tests
        run: node --test tests/docs/cloud-costs.test.cjs

      # pyrightconfig.json analyses everything as Linux / Python 3.12; the Airflow-only imports are
      # not reported here and are covered by the dags job, which installs Airflow.
      - name: Python type check (pyright, zero diagnostics)
        run: npx --yes pyright@1.1.414 --warnings

  compose:
    # Validates the deployment topology definitions only. Nothing is built or deployed.
    name: Compose / Swarm file validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Interpolates both stack files with test-only secrets and checks that each fails closed when
      # a required secret is missing.
      - name: Validate the Compose file and the Swarm stack
        run: bash cicd/stacks/check-stack-files.sh

  containers:
    # The longest job: it starts only when the cheaper gates have passed, which include the
    # builder image's Maven command (build) and the stack files it deploys (compose).
    name: Build and smoke-test runtime images
    needs: [build, scripts, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images and run packaged API and Airflow pipelines
        run: bash cicd/images/smoke-images.sh

      - name: Verify the complete Compose stack and metadata backup recovery
        run: bash cicd/images/smoke-compose.sh
