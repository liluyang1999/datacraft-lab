name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Full gate: Spotless format check, Checkstyle, Enforcer, unit tests, shaded package.
      - name: Verify
        run: ./mvnw -B -ntp verify

      # SparkPipelineSpec boots a real SparkSession, so it is what proves Spark 4.2.0 actually
      # runs on JDK 25. It self-cancels on hosts that cannot open NIO selectors, and a canceled
      # suite would still report as a passing build - which would hide exactly what must be
      # proven here. Fail loudly instead.
      - name: Assert the Spark suite really ran
        run: |
          REPORT=datacraft-spark/target/surefire-reports/datacraft-spark-scalatest.txt
          test -f "$REPORT" || { echo "::error::scalatest report not found at $REPORT"; exit 1; }
          grep -q "SparkPipelineSpec" "$REPORT" || { echo "::error::SparkPipelineSpec never ran"; exit 1; }
          if ! grep -q "canceled 0," "$REPORT"; then
            echo "::error::Spark suite was canceled - Spark did not start on this JDK"
            cat "$REPORT"
            exit 1
          fi
          grep -E "Tests: succeeded" "$REPORT"

      # This smoke test proves the shaded jar is runnable and that Spark stays out of it
      # (Spark is a provided dependency; these commands must not need it).
      - name: Smoke-test the CLI jar
        run: |
          JAR=datacraft-cli/target/datacraft-cli.jar
          test -f "$JAR" || { echo "CLI jar missing at $JAR"; exit 1; }
          java -jar "$JAR" --command list-jobs
          java -jar "$JAR" --command echo --param message=ci
          java -jar "$JAR" --command noop --lifecycle prod

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk25
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  dags:
    name: Airflow DAG syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile DAGs
        run: python -m py_compile orchestration/airflow/dags/*.py

  scripts:
    name: Deployment script lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for f in deploy/scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --severity=error deploy/scripts/*.sh

  compose:
    # Validates the deployment topology definitions only. Nothing is built or deployed.
    name: Compose / Swarm file validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Provide a non-secret .env for interpolation
        run: cp deploy/compose/.env.example deploy/compose/.env

      - name: Validate single-host compose file
        run: docker compose -f deploy/compose/docker-compose.yml config --quiet

      - name: Validate multi-host swarm stack file
        run: docker compose -f deploy/swarm/docker-stack.yml config --quiet
