# Log4j 2 configuration for test JVMs that carry Spark (and therefore Log4j) on the classpath.
# Negative tests make Spark and Hadoop log expected task failures; keep the build output readable.
# Debug with -Ddatacraft.test.log.level=info (passed to the test JVM through argLine).
status = error
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p %c{1}: %m%n%ex
rootLogger.level = ${sys:datacraft.test.log.level:-off}
rootLogger.appenderRef.console.ref = console
