# datacraft-lab — single-host deployment (Docker Compose, Airflow 3.x, LocalExecutor).
#
# Topology: Postgres (metadata) + Airflow (api-server, scheduler, dag-processor, triggerer) running
# the custom datacraft Airflow image, plus the datacraft JVM HTTP API. LocalExecutor keeps it to one
# host with no broker — the cheapest footprint that still runs the full platform.
#
# Quick start (from repo root):
#   python3 deploy/scripts/deployment_env.py init
#   bash deploy/scripts/build-images.sh
#   bash deploy/scripts/compose-up.sh
#
# The DAGs and the CLI jar both come from the Airflow image, so rerun build-images.sh after updating
# the code; a `git pull` alone does not change the running stack. Every secret must be set in .env:
# interpolation fails instead of falling back to a default.
#
# Airflow occasionally adjusts component names/flags between minors. If a service fails to start,
# run `docker compose config` and cross-check the official Airflow docker-compose for your version.

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  image: datacraft/airflow:latest
  # Never pulled: the unqualified datacraft/* names resolve to a Docker Hub namespace this project
  # does not own. build-images.sh creates the images (a Compose-triggered build lacks its JAR_IMAGE
  # build-arg and fails closed).
  pull_policy: never
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile.airflow
  env_file:
    - .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-1}
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: ${AIRFLOW_PARSING_PROCESSES:-1}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    DATACRAFT_HOME: /opt/datacraft
    DATACRAFT_CLI_JAR: /opt/datacraft/datacraft-cli.jar
    DATACRAFT_SPARK_MASTER: ${DATACRAFT_SPARK_MASTER:-local[2]}
    # Job and DAG path parameters must stay inside the shared data volume.
    DATACRAFT_DATA_ROOT: /opt/datacraft/data
  volumes:
    - airflow-logs:/opt/airflow/logs
    - datacraft-data:/opt/datacraft/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging: *bounded-logging

services:
  postgres:
    image: postgres:18
    logging: *bounded-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}", "-d", "${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: migrate the metadata DB and create the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    entrypoint: /opt/datacraft/airflow-bootstrap.sh
    command: []
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_WEB_BIND:-127.0.0.1}:${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # The JVM online engine API (independent of Airflow; handy for synchronous job runs). It has no
  # authentication, so it is published on loopback only (deployment_env.py check enforces this).
  datacraft-api:
    image: datacraft/jvm:latest
    pull_policy: never
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.jvm
    environment:
      # Small-file jobs may only read paths under this root.
      DATACRAFT_DATA_ROOT: /opt/datacraft/data
    volumes:
      # Read-only: Airflow tasks write the shared data, the API only reads it.
      - datacraft-data:/opt/datacraft/data:ro
    ports:
      - "127.0.0.1:${DATACRAFT_API_PORT:-8088}:8080"
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
  datacraft-data:
