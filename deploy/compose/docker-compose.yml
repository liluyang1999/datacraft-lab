# datacraft-lab — single-host deployment (Docker Compose, Airflow 3.x, LocalExecutor).
#
# Topology: Postgres (metadata) + Airflow (api-server, scheduler, dag-processor, triggerer) running
# the custom datacraft Airflow image, plus the datacraft JVM HTTP API. LocalExecutor keeps it to one
# host with no broker — the cheapest footprint that still runs the full platform.
#
# Quick start (from repo root):
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit secrets
#   bash deploy/scripts/build-images.sh
#   bash deploy/scripts/compose-up.sh
#
# Airflow occasionally adjusts component names/flags between minors. If a service fails to start,
# run `docker compose config` and cross-check the official Airflow docker-compose for your version.

x-airflow-common: &airflow-common
  image: datacraft/airflow:latest
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile.airflow
  env_file:
    - .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-please-change-me}
    DATACRAFT_HOME: /opt/datacraft
    DATACRAFT_CLI_JAR: /opt/datacraft/datacraft-cli.jar
    DATACRAFT_SPARK_MASTER: ${DATACRAFT_SPARK_MASTER:-local[*]}
  volumes:
    - ../../orchestration/airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - datacraft-data:/opt/datacraft/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: migrate the metadata DB and create the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Data --lastname Craft --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # The JVM online engine API (independent of Airflow; handy for synchronous job runs).
  datacraft-api:
    image: datacraft/jvm:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.jvm
    ports:
      - "${DATACRAFT_API_PORT:-8088}:8080"
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
  datacraft-data:
