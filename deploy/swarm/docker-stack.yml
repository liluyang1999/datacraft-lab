# datacraft-lab — multi-host deployment (Docker Swarm, Airflow 3.x, CeleryExecutor).
#
# Adds Redis and Celery workers to the single-host topology. Services sharing node-local data
# are pinned to DATACRAFT_DATA_NODE; use shared storage before distributing them across nodes.
#
# Swarm stacks cannot `build:` or read `.env` automatically — images must be pre-built and pushed to
# a registry, and variables exported into the shell. Build/push the images first, then use
# deploy/scripts/swarm-deploy.sh to load the environment and deploy the stack.
#
# Deploy (from repo root, on a swarm manager):
#   bash deploy/scripts/swarm-deploy.sh

x-airflow-common: &airflow-common
  image: ${DATACRAFT_REGISTRY:-localhost:5000}/datacraft-airflow:${DATACRAFT_TAG:-latest}
  env_file:
    - ../compose/.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-please-change-me}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-1}
    DATACRAFT_HOME: /opt/datacraft
    DATACRAFT_CLI_JAR: /opt/datacraft/datacraft-cli.jar
    DATACRAFT_SPARK_MASTER: ${DATACRAFT_SPARK_MASTER:-local[*]}
  networks:
    - datacraft-net
  volumes:
    - airflow-logs:/opt/airflow/logs
    - datacraft-data:/opt/datacraft/data

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db:/var/lib/postgresql
    networks:
      - datacraft-net
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  redis:
    image: redis:8
    networks:
      - datacraft-net
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    deploy:
      replicas: 1
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  # Local-volume handoffs require the same host. Use shared storage before spreading workers.
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    deploy:
      replicas: ${AIRFLOW_WORKER_REPLICAS:-2}
      placement:
        constraints: ["node.hostname == ${DATACRAFT_DATA_NODE:?Set the persistent data hostname}"]

  datacraft-api:
    image: ${DATACRAFT_REGISTRY:-localhost:5000}/datacraft-jvm:${DATACRAFT_TAG:-latest}
    # The unauthenticated engine API is overlay-only; expose it through an authenticated gateway.
    networks:
      - datacraft-net
    deploy:
      replicas: 1

networks:
  datacraft-net:
    driver: overlay
    attachable: true

volumes:
  postgres-db:
  airflow-logs:
  datacraft-data:
